name: Auto Scraper

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:      # Manual trigger

# --- EI PART TA NOTUN JUKTO KORA HOLO (FIX) ---
permissions:
  contents: write
# ----------------------------------------------

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Scraper
        env:
          FAWA_URL: ${{ secrets.FAWA_URL }}
        run: python main.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fawanews_links.json
          # Change ache kina check korbe, thakle commit korbe natoba error dibe na
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update links" && git push)
